name: Calidad de código
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
jobs:
  quality:
    runs-on: ubuntu-latest
    name: PHPStan + Pint
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pgsql, pdo_pgsql
          coverage: none

      - name: Instalar dependencias
        run: |
          cd vida
          composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Auto-fix formato (Pint)
        run: |
          cd vida
          vendor/bin/pint

      - name: Commit cambios de formato
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "style: auto-fix Pint formatting"
          file_pattern: "vida/**/*.php" 

      - name: Análisis estático (PHPStan)
        run: |
          cd vida
          composer analyse-ci
