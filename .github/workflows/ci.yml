name: CI/CD

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0 # Para monorepo completo
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
      - name: Install Composer Dependencies (Backend)
        env:
          COMPOSER_AUTH: '{"github-oauth":{"github.com":"${{ secrets.GITHUB_TOKEN }}"}}'
        run: |
          cd vida
          composer install --no-progress --no-interaction --prefer-dist

  deploy:
    needs: test
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          debug: true
          script: |
            set -e
            cd /var/www/vida-project/vida

            git fetch origin
            git reset --hard origin/master

            # Permisos ANTES de cualquier operación de escritura sobre storage/
            sudo chown -R jupiter:www-data /var/www/vida-project/vida/storage /var/www/vida-project/vida/bootstrap/cache
            sudo chmod -R 775 /var/www/vida-project/vida/storage /var/www/vida-project/vida/bootstrap/cache

            composer install --no-dev --optimize-autoloader --no-interaction

            npm ci --no-audit --no-fund --silent || npm install --no-audit --no-fund --silent
            npm run build

            php artisan migrate --force

            # Limpiar cachés antes de regenerar para evitar archivos corruptos o inaccesibles
            php artisan optimize:clear
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache

            # Reiniciar PHP-FPM para vaciar OPcache
            sudo systemctl restart php8.3-fpm
