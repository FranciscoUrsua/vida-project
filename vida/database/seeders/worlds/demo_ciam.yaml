# Mundo «Prueba CIAM» — modo ADITIVO
#
# Se carga con:   php artisan demo:load --world=demo_ciam [--dry-run]
# NUNCA con demo:reset (el comando lo rechaza): en staging hay datos de otros equipos,
# incluido el propio centro CIAM Puente de Vallecas, que aquí solo se referencia.
#
# Todo lo que crea este mundo queda registrado en demo_world_registros con la
# etiqueta TEST_CIAM. La carga es idempotente: una segunda ejecución no crea nada.
#
# Decisiones de esta fase (ver docs/instrucciones-cli/2026-09-demo-ciam-aditivo.md):
# - Ninguna usuaria es VVG ni pertenece a colectivo protegido; no hay escenario urgente.
# - Los planes son de tipo PIA, especializados y de entrada directa (sin PISO previo).
# - Cargos del catálogo existente (nombres neutros); no se crea ninguno.
# - Sin documentos de identidad (los mundos existentes no generan ninguno).

meta:
  nombre: "Prueba CIAM"
  descripcion: "CIAM Puente de Vallecas: 10 profesionales, 100 usuarias (50 con PIA de entrada directa) y 4 actividades grupales. Aditivo: no borra datos."
  reset_cada: "no aplica (aditivo)"

modo: aditivo
etiqueta: TEST_CIAM

# Tipo de plan (id de existentes.tipos_plan) de los escenarios con plan.
tipo_plan: pia

existentes:
  centros:
    - id: ciam_pv
      buscar_por: { nombre: "CIAM Puente de Vallecas" }

  tipos_plan:
    - id: pia
      buscar_por: { slug: pia }

  cargos:
    - id: direccion
      buscar_por: { nombre: "Coordinador/a de Centro" }
    - id: trabajo_social
      buscar_por: { nombre: "Trabajador/a Social" }
    - id: psicologia
      buscar_por: { nombre: "Psicólogo/a" }
    - id: abogacia
      buscar_por: { nombre: "Abogado/a" }
    - id: administracion
      buscar_por: { nombre: "Administrativo/a" }
    - id: auxiliar_ss
      buscar_por: { nombre: "Auxiliar de Servicios Sociales" }

  salas:
    - id: girasol
      centro: ciam_pv
      buscar_por: { nombre: "Sala Girasol" }
      crear_si_no_existe: { capacidad: 15, accesible: true }
    - id: polivalente
      centro: ciam_pv
      buscar_por: { nombre: "Sala Polivalente" }
      crear_si_no_existe: { capacidad: 30, accesible: true }

  tipos_actividad:
    - id: empoderamiento
      buscar_por: { slug: taller-empoderamiento }
      crear_si_no_existe: { nombre: "Taller de empoderamiento" }
    - id: formacion
      buscar_por: { slug: formacion }
    - id: taller_empleo
      buscar_por: { slug: taller-empleo }
    # Equivalente existente de «sesión informativa».
    - id: sesion_informativa
      buscar_por: { slug: charla }

