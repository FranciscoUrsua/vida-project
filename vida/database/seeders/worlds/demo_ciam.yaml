# Actividades grupales (sustituyen a las del demo_ciam anterior).
# El estado de cada sesión se deduce de la fecha: pasada → celebrada; hoy o futura → programada.
actividades:
  - id: empoderamiento
    centro: ciam_pv
    tipo: empoderamiento
    nombre: Taller de empoderamiento
    modo_acceso: mixta
    aforo_total: 25
    profesionales: [psicologa.ciam@vida.local, ts1.ciam@vida.local]
    sesiones:
      - { fecha: "-21d", hora_inicio: "10:00", hora_fin: "12:00", sala: girasol }
      - { fecha: "-14d", hora_inicio: "10:00", hora_fin: "12:00", sala: girasol }
      - { fecha: "-7d", hora_inicio: "10:00", hora_fin: "12:00", sala: girasol }
      - { fecha: "+7d", hora_inicio: "10:00", hora_fin: "12:00", sala: girasol }

  - id: competencias_digitales
    centro: ciam_pv
    tipo: formacion
    nombre: Formación en competencias digitales
    modo_acceso: mixta
    aforo_total: 25
    profesionales: [aux1.ciam@vida.local]
    sesiones:
      - { fecha: "-14d", hora_inicio: "16:00", hora_fin: "18:00", sala: polivalente }
      - { fecha: "-7d", hora_inicio: "16:00", hora_fin: "18:00", sala: polivalente }
      - { fecha: "0d", hora_inicio: "16:00", hora_fin: "18:00", sala: polivalente }
      - { fecha: "+7d", hora_inicio: "16:00", hora_fin: "18:00", sala: polivalente }

  - id: busqueda_empleo
    centro: ciam_pv
    tipo: taller_empleo
    nombre: Taller de búsqueda de empleo
    modo_acceso: mixta
    aforo_total: 25
    profesionales: [ts2.ciam@vida.local, aux2.ciam@vida.local]
    sesiones:
      - { fecha: "-10d", hora_inicio: "10:00", hora_fin: "12:00", sala: polivalente }
      - { fecha: "-3d", hora_inicio: "10:00", hora_fin: "12:00", sala: polivalente }
      - { fecha: "+4d", hora_inicio: "10:00", hora_fin: "12:00", sala: polivalente }

  - id: derechos
    centro: ciam_pv
    tipo: sesion_informativa
